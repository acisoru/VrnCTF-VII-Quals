name: iworshippdf

services:
  nextjsinstance:
    build: .
    scale: 10
    environment:
      - NODE_ENV=production
    networks:
      - app_network
  
  loadbalancer:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - nextjsinstance
    networks:
      - app_network

networks:
  app_network:
    driver: bridge