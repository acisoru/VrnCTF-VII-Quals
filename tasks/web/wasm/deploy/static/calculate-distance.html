<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расчет Дистанции</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>">
</head>
<body>
    <div id="header"></div>
    <div class="container mt-5">
        <h2>Калькулятор: Расстояние</h2>
        <p class="text-muted">Расстояние (Сажени) = Скорость (Саж./ч) × Время (Часы)</p>
        <div class="row g-3 align-items-center mb-3">
            <div class="col-auto">
                <label for="speed" class="col-form-label">Скорость (Саж./ч)</label>
            </div>
            <div class="col-auto">
                <input type="number" id="speed" class="form-control" style="width: 120px;">
            </div>
            <div class="col-auto">
                <span class="form-text fs-4">×</span>
            </div>
            <div class="col-auto">
                <label for="time" class="col-form-label">Время (Часы)</label>
            </div>
            <div class="col-auto">
                <input type="number" id="time" class="form-control" style="width: 120px;">
            </div>
            <div class="col-auto">
                 <span class="form-text fs-4">=</span>
            </div>
            <div class="col-auto">
                <label for="result-distance" class="col-form-label">Расстояние (Сажени)</label>
            </div>
            <div class="col-auto">
                <input type="number" id="result-distance" class="form-control" readonly disabled style="width: 120px;">
            </div>
        </div>
    </div>
    <script src="/js/app.js"></script>
    <script src="/js/wasm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        generateHeader();

        const speedInput = document.getElementById('speed');
        const timeInput = document.getElementById('time');
        const resultDistanceInput = document.getElementById('result-distance');

        Module().then(mod => {
            function calculateDistance() {
                const speed = parseFloat(speedInput.value);
                const time = parseFloat(timeInput.value);

                if (!isNaN(speed) && !isNaN(time)) {
                resultDistanceInput.value = mod.ccall('calc_distance_sazhen_c', 'number', ['number', 'number'], [speed, time]);
                } else {
                    resultDistanceInput.value = '';
                }
            }

            speedInput.addEventListener('input', calculateDistance);
            timeInput.addEventListener('input', calculateDistance);
        });
    </script>
</body>
</html>
