<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор: Вершки и Аршины</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>">
</head>
<body>
    <div id="header"></div>
    <div class="container mt-5">
        <h2>Калькулятор: Вершки и Аршины</h2>
        <div class="row g-3 align-items-center mb-3">
            <div class="col-auto">
                <label for="vershki" class="col-form-label">Вершки</label>
            </div>
            <div class="col-auto">
                <input type="number" id="vershki" class="form-control" aria-describedby="vershkiHelpInline" style="width: 120px;">
            </div>
            <div class="col-auto">
                <span id="vershkiHelpInline" class="form-text">
                    =
                </span>
            </div>
            <div class="col-auto">
                <label for="arshiny" class="col-form-label">Аршины</label>
            </div>
            <div class="col-auto">
                <input type="number" id="arshiny" class="form-control" aria-describedby="arshinyHelpInline" style="width: 120px;">
            </div>
        </div>
         <p class="text-muted">1 Аршин = 16 Вершков</p>
    </div>
    <script src="/js/app.js"></script>
    <script src="/js/wasm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        generateHeader();

        const vershkiInput = document.getElementById('vershki');
        const arshinyInput = document.getElementById('arshiny');

        Module().then(mod => {
            vershkiInput.addEventListener('input', function() {
                const vershki = parseFloat(this.value);
                if (!isNaN(vershki)) {
                    arshinyInput.value = mod.ccall('vershok_to_arshin_c', 'number', ['number'], [vershki]);
                } else {
                    arshinyInput.value = '';
                }
            });

            arshinyInput.addEventListener('input', function() {
                const arshiny = parseFloat(this.value);
                if (!isNaN(arshiny)) {
                    vershkiInput.value = mod.ccall('arshin_to_vershok_c', 'number', ['number'], [arshiny]);
                } else {
                    vershkiInput.value = '';
                }
            });
        });
    </script>
</body>
</html>
