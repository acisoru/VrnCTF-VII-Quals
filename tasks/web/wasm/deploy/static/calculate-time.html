<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор: Время в пути</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>">
</head>
<body>
    <div id="header"></div>
    <div class="container mt-5">
        <h2>Калькулятор: Время в пути</h2>
        <p class="text-muted">Время (Часы) = Расстояние (Сажени) ÷ Скорость (Саж./ч)</p>
        <div class="row g-3 align-items-center mb-3">
            <div class="col-auto">
                <label for="distance" class="col-form-label">Расстояние (Сажени)</label>
            </div>
            <div class="col-auto">
                <input type="number" id="distance" class="form-control" style="width: 120px;">
            </div>
            <div class="col-auto">
                 <span class="form-text fs-4">÷</span>
            </div>
            <div class="col-auto">
                <label for="speed" class="col-form-label">Скорость (Саж./ч)</label>
            </div>
            <div class="col-auto">
                <input type="number" id="speed" class="form-control" style="width: 120px;">
            </div>
            <div class="col-auto">
                 <span class="form-text fs-4">=</span>
            </div>
            <div class="col-auto">
                <label for="result-time" class="col-form-label">Время (Часы)</label>
            </div>
            <div class="col-auto">
                <input type="number" id="result-time" class="form-control" readonly disabled style="width: 120px;">
            </div>
        </div>
    </div>
    <script src="/js/app.js"></script>
    <script src="/js/wasm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        generateHeader();

        const distanceInput = document.getElementById('distance');
        const speedInput = document.getElementById('speed');
        const resultTimeInput = document.getElementById('result-time');

        Module().then(mod => {
            function calculateTime() {
                const distance = parseFloat(distanceInput.value);
                const speed = parseFloat(speedInput.value);
                if (!isNaN(distance) && !isNaN(speed) && speed !== 0) {
                    resultTimeInput.value = mod.ccall('travel_time_hours_c', 'number', ['number', 'number'], [distance, speed]);
                } else {
                    resultTimeInput.value = '';
                }
            }
            
            distanceInput.addEventListener('input', calculateTime);
            speedInput.addEventListener('input', calculateTime);
        });
    </script>
</body>
</html>
