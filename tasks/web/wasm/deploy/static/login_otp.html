<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход с OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>">
</head>
<body>
    <div id="header"></div>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <h2>Вход с OTP</h2>
                <div id="alert-placeholder"></div>
                <form id="login-otp-form" class="mt-4">
                    <div class="mb-3">
                        <label for="username" class="form-label">Логин</label>
                        <input type="text" class="form-control" id="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="otp" class="form-label">OTP</label>
                        <input type="text" class="form-control" id="otp" required maxlength="7" pattern="[0-9]{3} [0-9]{3}" inputmode="numeric" placeholder="123 456">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Войти</button>
                        <a href="/login.html" class="btn btn-outline-primary">Войти с помощью пароля</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        generateHeader();
        document.getElementById('login-otp-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const otpInput = document.getElementById('otp');
            const otp = otpInput.value.replace(/\s/g, '');

            fetch('/login_otp', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: username,
                    otp: otp
                })
            })
            .then(response => {
                if (response.ok) {
                    window.location.href = '/home.html';
                } else {
                    throw new Error('Login failed');
                }
            })
            .catch(error => {
                const alertPlaceholder = document.getElementById('alert-placeholder');
                const wrapper = document.createElement('div');
                wrapper.innerHTML = [
                    `<div class="alert alert-danger alert-dismissible" role="alert">`,
                    `   <div>Неверный логин или OTP</div>`,
                    '   <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>',
                    '</div>'
                ].join('');
                alertPlaceholder.innerHTML = '';
                alertPlaceholder.append(wrapper);
            });
        });

        // Add input formatting for OTP field
        const otpInput = document.getElementById('otp');
        otpInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, ''); // Remove non-digits
            if (value.length > 6) {
                value = value.slice(0, 6); // Limit to 6 digits
            }

            if (value.length > 3) {
                e.target.value = value.slice(0, 3) + ' ' + value.slice(3);
            } else {
                e.target.value = value;
            }
        });

         otpInput.addEventListener('keypress', function(e) {
            // Allow only digits
            if (!/\d/.test(e.key)) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
