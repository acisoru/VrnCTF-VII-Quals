<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор: Скорость</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>">
</head>
<body>
    <div id="header"></div>
    <div class="container mt-5">
        <h2>Калькулятор: Скорость</h2>
        <p class="text-muted">Скорость (Саж./ч) = Расстояние (Сажени) ÷ Время (Часы)</p>
        <div class="row g-3 align-items-center mb-3">
            <div class="col-auto">
                <label for="distance" class="col-form-label">Расстояние (Сажени)</label>
            </div>
            <div class="col-auto">
                <input type="number" id="distance" class="form-control" style="width: 120px;">
            </div>
            <div class="col-auto">
                <span class="form-text fs-4">÷</span>
            </div>
            <div class="col-auto">
                <label for="time" class="col-form-label">Время (Часы)</label>
            </div>
            <div class="col-auto">
                <input type="number" id="time" class="form-control" style="width: 120px;">
            </div>
             <div class="col-auto">
                 <span class="form-text fs-4">=</span>
            </div>
            <div class="col-auto">
                <label for="result-speed" class="col-form-label">Скорость (Саж./ч)</label>
            </div>
            <div class="col-auto">
                <input type="number" id="result-speed" class="form-control" readonly disabled style="width: 120px;">
            </div>
        </div>
    </div>
    <script src="/js/app.js"></script>
    <script src="/js/wasm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        generateHeader();

        const distanceInput = document.getElementById('distance');
        const timeInput = document.getElementById('time');
        const resultSpeedInput = document.getElementById('result-speed');

        Module().then(mod => {
            function calculateSpeed() {
                const distance = parseFloat(distanceInput.value);
                const time = parseFloat(timeInput.value);
                if (!isNaN(distance) && !isNaN(time) && time !== 0) {
                    resultSpeedInput.value = mod.ccall('travel_time_hours_c', 'number', ['number', 'number'], [distance, time]);
                } else {
                    resultSpeedInput.value = '';
                }
            }

            distanceInput.addEventListener('input', calculateSpeed);
            timeInput.addEventListener('input', calculateSpeed);
        });
    </script>
</body>
</html>
